server:
  url: https://example.org/iiif
run:
  - folder-collections
  - extract-collection-thumbnail
  - feature-heritage
  - collection-item-order
  - collection-thumbnail
  - featured-part-of
stores:
  local:
    type: iiif-json
    path: ./fixtures
    base: ./fixtures
    destination: collections
    pattern: '**/*.json'
    subFiles: true
config:
  collection-item-order:
    byCollection:
      collections/printed-works: label
  folder-collections:
    labelStrategy: metadata
collections:
  index:
    label: { en: [Heritage catalogue] }
    items: [featured, manifests]
  featured:
    label: { en: [Collections] }
    summary:
      en: ["Explore a world of ideas. Discover the objects, printed works and images that tell the story of science and the city."]
    thumbnail:
      - id: /images/delft.jpg
        type: Image
    behavior: [https://example.org/behaviors/collections-home]
